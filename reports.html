<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reports | Tech Mahindra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      :root {
        --tm-red: #e31837;
        --tm-dark: #1f2937;
        --tm-gray: #616a75;
        --tm-light: #f9fafb;
        --tm-white: #ffffff;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
        font-family: system-ui;
      }

      body {
        margin: 0;
        background: var(--tm-light);
        color: var(--tm-dark);
      }

      .layout {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 240px;
        background: var(--tm-dark);
        color: var(--tm-white);
        padding: 24px;
      }

      .sidebar h2 {
        margin: 0 0 32px;
        color: var(--tm-red);
        font-size: 20px;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .nav-section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .nav-label {
        color: #6b7280;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .nav a {
        display: block;
        color: #d1d5db;
        text-decoration: none;
        padding: 6px 0;
        font-size: 14px;
      }

      .nav a.active,
      .nav a:hover {
        color: var(--tm-white);
      }

      .content {
        flex: 1;
        padding: 32px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        background: var(--tm-white);
        padding: 32px;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }

      h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      p.lead {
        font-size: 14px;
        color: var(--tm-gray);
        margin-bottom: 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-size: 14px;
        margin-bottom: 6px;
        font-weight: 500;
      }

      select {
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        font-size: 14px;
        background: var(--tm-white);
      }

      select:disabled {
        background: var(--tm-light);
        color: var(--tm-gray);
        cursor: not-allowed;
      }

      .layer-info {
        font-size: 13px;
        color: var(--tm-gray);
        min-height: 20px;
        margin-bottom: 20px;
      }

      .layer-info strong {
        color: var(--tm-dark);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 4px;
      }

      .btn {
        padding: 12px 16px;
        border-radius: 6px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
      }

      .csv {
        background: var(--tm-red);
        color: #fff;
      }

      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .status {
        font-size: 13px;
        color: var(--tm-gray);
      }

      .status.error {
        color: var(--tm-red);
      }
      .status.ok {
        color: #047857;
      }

      /* ── Planned vs as-built + BOQ reconciliation (Stage 8) ──────────── */
      .report-card {
        margin-top: 28px;
        padding: 20px;
        background: var(--tm-white);
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .report-card h2 {
        margin: 0 0 4px;
        font-size: 17px;
      }

      .report-card h3 {
        margin: 26px 0 8px;
        font-size: 12px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--tm-gray);
      }

      .report-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        overflow-x: auto;
      }

      .report-table th,
      .report-table td {
        padding: 7px 10px;
        border-bottom: 1px solid var(--border);
        text-align: left;
      }

      .report-table th {
        background: var(--tm-light);
        font-weight: 600;
      }

      .report-table .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .report-table .delta-far {
        color: #b45309;
        font-weight: 600;
      }

      .report-table .delta-exact {
        color: #047857;
      }

      .report-muted {
        font-size: 13px;
        color: var(--tm-gray);
      }

      .btn.project {
        background: var(--tm-dark);
        color: #fff;
      }
    </style>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="layout">
      <div id="sidebarContainer"></div>

      <main class="content">
        <div class="container">
          <h1>Reports & Exports</h1>
          <p class="lead">
            Export a layer's features to CSV. Every feature in the layer is included; inspected features carry their
            recorded field measurements.
          </p>

          <div class="grid">
            <div>
              <label for="projectSelect">Project</label>
              <select id="projectSelect">
                <option value="">Loading projects…</option>
              </select>
            </div>

            <div>
              <label for="layerSelect">Layer</label>
              <select id="layerSelect" disabled>
                <option value="">Select a project first</option>
              </select>
            </div>
          </div>

          <div class="layer-info" id="layerInfo"></div>

          <div class="actions">
            <button type="button" class="btn csv" id="exportCsvBtn" disabled>Export CSV</button>
            <span class="status" id="status"></span>
          </div>

          <div class="report-card" id="asBuiltCard" hidden>
            <h2>Planned vs as-built</h2>
            <p class="report-muted" id="asBuiltLead"></p>
            <div class="actions">
              <button type="button" class="btn project" id="exportProjectBtn">
                Export project workbook (.xlsx)
              </button>
              <span class="status" id="projectStatus"></span>
            </div>
            <div id="asBuiltBody"></div>
            <div id="boqBody"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="fiber-api.js"></script>
    <script>
      window.FiberAuth.requireLogin();

      var projectSelect = document.getElementById('projectSelect');
      var layerSelect = document.getElementById('layerSelect');
      var exportBtn = document.getElementById('exportCsvBtn');
      var statusEl = document.getElementById('status');
      var layerInfoEl = document.getElementById('layerInfo');

      // Cache of the selected project's layers, keyed by layer_id, for counts/labels.
      var layersById = {};

      function setStatus(msg, kind) {
        statusEl.textContent = msg || '';
        statusEl.className = 'status' + (kind ? ' ' + kind : '');
      }

      function pickProjectId(p) {
        return (p && (p.uuid || p.id || p.project_uuid || p.pk)) || null;
      }
      function pickProjectName(p) {
        return (p && (p.name || p.title || p.project_name)) || '';
      }
      function pickLayerId(l) {
        return (l && (l.layer_id || l.id || l.name)) || null;
      }
      function pickLayerName(l) {
        return (l && (l.layer_name || l.name || l.title)) || '';
      }

      function normalizeList(data, keys) {
        if (Array.isArray(data)) return data;
        if (!data) return [];
        for (var i = 0; i < keys.length; i++) {
          if (Array.isArray(data[keys[i]])) return data[keys[i]];
        }
        return [];
      }

      function refreshExportEnabled() {
        exportBtn.disabled = !(projectSelect.value && layerSelect.value);
      }

      // Self-contained pagination walk, using only listProjects + apiFetch. Older
      // deployed builds of fiber-api.js don't export a fetch-all-pages helper.
      async function fetchAllProjects() {
        var first = await window.FiberApi.listProjects();
        if (Array.isArray(first)) return first;
        if (!first || !Array.isArray(first.results)) return [];
        var all = first.results.slice();
        var next = first.next;
        while (next && typeof window.FiberApi.apiFetch === 'function') {
          var page = await window.FiberApi.apiFetch(next, { method: 'GET' });
          if (!page || !Array.isArray(page.results)) break;
          all = all.concat(page.results);
          next = page.next || null;
        }
        return all;
      }

      async function loadProjects() {
        try {
          var list = await fetchAllProjects();
          projectSelect.innerHTML = '<option value="">Select Project</option>';
          list.forEach(function (p) {
            var id = pickProjectId(p);
            if (!id) return;
            var opt = document.createElement('option');
            opt.value = id;
            opt.textContent = pickProjectName(p) || 'Project ' + id;
            projectSelect.appendChild(opt);
          });
          if (!list.length) {
            projectSelect.innerHTML = '<option value="">No projects found</option>';
          }
        } catch (e) {
          projectSelect.innerHTML = '<option value="">Failed to load projects</option>';
          setStatus((e && e.message) || 'Failed to load projects.', 'error');
        }
      }

      async function loadLayers(projectId) {
        layersById = {};
        layerInfoEl.textContent = '';
        layerSelect.innerHTML = '<option value="">Loading layers…</option>';
        layerSelect.disabled = true;
        refreshExportEnabled();

        if (!projectId) {
          layerSelect.innerHTML = '<option value="">Select a project first</option>';
          return;
        }

        try {
          var data = await window.FiberApi.listProjectLayers(projectId);
          var list = normalizeList(data, ['layers', 'results']);

          layerSelect.innerHTML = '<option value="">Select Layer</option>';
          list.forEach(function (l) {
            var id = typeof l === 'string' ? l : pickLayerId(l);
            if (!id) return;
            layersById[id] = l;
            var name = typeof l === 'string' ? l : pickLayerName(l) || id;
            var count = l && typeof l.feature_count === 'number' ? ' (' + l.feature_count + ')' : '';
            var opt = document.createElement('option');
            opt.value = id;
            opt.textContent = name + count;
            layerSelect.appendChild(opt);
          });

          if (!list.length) {
            layerSelect.innerHTML = '<option value="">No layers in this project</option>';
          } else {
            layerSelect.disabled = false;
          }
        } catch (e) {
          layerSelect.innerHTML = '<option value="">Failed to load layers</option>';
          setStatus((e && e.message) || 'Failed to load layers.', 'error');
        }
      }

      function showLayerInfo(layerId) {
        var l = layersById[layerId];
        if (!l || typeof l !== 'object') {
          layerInfoEl.textContent = '';
          return;
        }
        var counts = l.status_counts || {};
        var parts = [];
        if (typeof counts.approved === 'number') parts.push(counts.approved + ' approved');
        if (typeof counts.under_review === 'number' && counts.under_review)
          parts.push(counts.under_review + ' under review');
        if (typeof counts.assigned === 'number' && counts.assigned) parts.push(counts.assigned + ' assigned');
        if (typeof counts.pending === 'number') parts.push(counts.pending + ' pending');
        var total = typeof l.feature_count === 'number' ? l.feature_count : '';
        layerInfoEl.innerHTML = total
          ? '<strong>' + total + '</strong> features' + (parts.length ? ' — ' + parts.join(', ') : '')
          : '';
      }

      // ---- CSV building ----

      function cellToString(v) {
        if (v === null || v === undefined) return '';
        if (typeof v === 'object') {
          try {
            return JSON.stringify(v);
          } catch (_) {
            return '';
          }
        }
        return String(v);
      }

      function escapeCsv(v) {
        var s = cellToString(v);
        if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      }

      function firstSchema(features) {
        for (var i = 0; i < features.length; i++) {
          var fs = features[i].field_schema;
          if (Array.isArray(fs) && fs.length) return fs;
        }
        return null;
      }

      // Build the ordered column list: field_schema (order + human label) first,
      // then any property keys the schema didn't mention. Falls back to the union
      // of property/measurement keys when a layer has no schema.
      function buildColumns(features) {
        var cols = [];
        var seen = {};
        var schema = firstSchema(features);

        if (schema) {
          schema
            .slice()
            .sort(function (a, b) {
              return (a.order == null ? 0 : a.order) - (b.order == null ? 0 : b.order);
            })
            .forEach(function (s) {
              if (!s || !s.key || seen[s.key]) return;
              seen[s.key] = true;
              cols.push({ key: s.key, label: s.label || s.key });
            });
        }

        features.forEach(function (f) {
          var p = f.properties && typeof f.properties === 'object' ? f.properties : {};
          Object.keys(p).forEach(function (k) {
            if (!seen[k]) {
              seen[k] = true;
              cols.push({ key: k, label: k });
            }
          });
          if (!schema) {
            var m = f.field_measurements && typeof f.field_measurements === 'object' ? f.field_measurements : {};
            Object.keys(m).forEach(function (k) {
              if (!seen[k]) {
                seen[k] = true;
                cols.push({ key: k, label: k });
              }
            });
          }
        });

        return cols;
      }

      function buildCsv(features) {
        var cols = buildColumns(features);
        var header = cols
          .map(function (c) {
            return c.label;
          })
          .concat(['Status', 'Feature ID']);
        var rows = [header];

        features.forEach(function (f) {
          var props = f.properties && typeof f.properties === 'object' ? f.properties : {};
          var meas = f.field_measurements && typeof f.field_measurements === 'object' ? f.field_measurements : {};
          // Editable (measurement/qc) values live in field_measurements and take
          // precedence; read-only reference values live in properties.
          var merged = Object.assign({}, props, meas);
          var row = cols.map(function (c) {
            return merged[c.key];
          });
          row.push(f.status || '', f.id || '');
          rows.push(row);
        });

        return rows
          .map(function (r) {
            return r.map(escapeCsv).join(',');
          })
          .join('\r\n');
      }

      function sanitize(name) {
        return (
          String(name || '')
            .replace(/[^a-z0-9]+/gi, '-')
            .replace(/^-+|-+$/g, '') || 'export'
        );
      }

      function todayStr() {
        var d = new Date();
        var mm = ('0' + (d.getMonth() + 1)).slice(-2);
        var dd = ('0' + d.getDate()).slice(-2);
        return d.getFullYear() + '-' + mm + '-' + dd;
      }

      function downloadCsv(text, filename) {
        var blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 0);
      }

      async function exportCsv() {
        var projectId = projectSelect.value;
        var layerId = layerSelect.value;
        if (!projectId || !layerId) {
          setStatus('Select a project and a layer.', 'error');
          return;
        }

        exportBtn.disabled = true;
        setStatus('Fetching features…');

        try {
          var data = await window.FiberApi.getProjectLayerDetails(projectId, layerId);
          var features = data && Array.isArray(data.features) ? data.features : [];

          if (!features.length) {
            setStatus('This layer has no features to export.', 'error');
            return;
          }

          var csv = buildCsv(features);

          var projName = '';
          var projOpt = projectSelect.options[projectSelect.selectedIndex];
          if (projOpt) projName = projOpt.textContent;
          var layerName =
            (data && data.layer && data.layer.layer_name) ||
            (layersById[layerId] && pickLayerName(layersById[layerId])) ||
            layerId;

          var filename = sanitize(projName) + '_' + sanitize(layerName) + '_' + todayStr() + '.csv';
          downloadCsv(csv, filename);

          setStatus('Exported ' + features.length + ' features to ' + filename, 'ok');
        } catch (e) {
          setStatus((e && e.message) || 'Failed to export CSV.', 'error');
        } finally {
          refreshExportEnabled();
        }
      }

      projectSelect.addEventListener('change', function () {
        setStatus('');
        loadLayers(projectSelect.value);
        loadAsBuilt(projectSelect.value);
      });

      layerSelect.addEventListener('change', function () {
        setStatus('');
        showLayerInfo(layerSelect.value);
        refreshExportEnabled();
      });

      exportBtn.addEventListener('click', exportCsv);

      // ── Stage 8: planned vs as-built, BOQ reconciliation, workbook export ──

      var asBuiltCard = document.getElementById('asBuiltCard');
      var asBuiltLead = document.getElementById('asBuiltLead');
      var asBuiltBody = document.getElementById('asBuiltBody');
      var boqBody = document.getElementById('boqBody');
      var projectExportBtn = document.getElementById('exportProjectBtn');
      var projectStatusEl = document.getElementById('projectStatus');

      function setProjectStatus(msg, kind) {
        projectStatusEl.textContent = msg || '';
        projectStatusEl.className = 'status' + (kind ? ' ' + kind : '');
      }

      function escHtml(value) {
        return String(value === undefined || value === null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function num(value, digits) {
        if (value === null || value === undefined) return '—';
        var n = Number(value);
        if (!isFinite(n)) return '—';
        return n.toLocaleString(undefined, {
          maximumFractionDigits: digits === undefined ? 2 : digits,
        });
      }

      // Same direction as the decision record and the audit view: planned minus
      // as-built, so a shortfall reads negative everywhere.
      function deltaHtml(value, unit) {
        if (value === null || value === undefined) return '<span class="report-muted">—</span>';
        var n = Number(value);
        var cls = Math.abs(n) < 0.005 ? 'delta-exact' : 'delta-far';
        return (
          '<span class="' +
          cls +
          '">' +
          (n > 0 ? '+' : '') +
          num(n) +
          (unit ? ' ' + unit : '') +
          '</span>'
        );
      }

      function reportTable(headers, rows) {
        var head = headers
          .map(function (h) {
            return '<th' + (h.num ? ' class="num"' : '') + '>' + escHtml(h.label) + '</th>';
          })
          .join('');
        return (
          '<table class="report-table"><thead><tr>' +
          head +
          '</tr></thead><tbody>' +
          rows.join('') +
          '</tbody></table>'
        );
      }

      function renderBoq(boq) {
        if (!boq.available) {
          boqBody.innerHTML =
            '<h3>BOQ reconciliation</h3><p class="report-muted">' +
            escHtml(boq.reason || 'No BOQ snapshot for this project.') +
            '</p>';
          return;
        }

        var length = boq.length || {};
        var sectionRows = (boq.sections || []).map(function (section) {
          var names = (section.layers || [])
            .map(function (layer) {
              return layer.layer_name || layer.layer_id;
            })
            .join(', ');
          return (
            '<tr>' +
            '<td>' +
            escHtml(section.section) +
            '</td>' +
            '<td class="num">' +
            num(section.boq_metres, 1) +
            '</td>' +
            '<td>' +
            (names ? escHtml(names) : '<span class="report-muted">no supervision layer</span>') +
            '</td>' +
            '<td class="num">' +
            (names ? num(section.planned_m, 1) : '—') +
            '</td>' +
            '<td class="num">' +
            (names ? num(section.as_built_m, 1) : '—') +
            '</td>' +
            '<td class="num">' +
            deltaHtml(section.delta_m, 'm') +
            '</td>' +
            '</tr>'
          );
        });

        boqBody.innerHTML =
          '<h3>BOQ reconciliation</h3>' +
          '<p class="report-muted">' +
          num(length.boq_m, 1) +
          ' m priced in the BOQ · ' +
          num(length.as_built_m, 1) +
          ' m recorded as laid · Δ ' +
          deltaHtml(length.delta_vs_as_built_m, 'm') +
          (length.delta_pct === null || length.delta_pct === undefined
            ? ''
            : ' (' + deltaHtml(length.delta_pct, '%') + ')') +
          '</p>' +
          reportTable(
            [
              { label: 'BOQ section' },
              { label: 'Priced (m)', num: true },
              { label: 'Matched layer' },
              { label: 'Planned (m)', num: true },
              { label: 'As-built (m)', num: true },
              { label: 'Δ (m)', num: true },
            ],
            sectionRows
          );
      }

      function renderAsBuilt(report) {
        var layers = (report && report.layers) || [];
        if (!layers.length) {
          asBuiltBody.innerHTML =
            '<p class="report-muted">This project has no imported features yet, so there is nothing to compare.</p>';
          boqBody.innerHTML = '';
          return;
        }

        var totals = report.totals || {};
        asBuiltLead.textContent =
          num(totals.features, 0) +
          ' features · ' +
          num(totals.completion_percentage, 1) +
          '% approved · ' +
          num(totals.planned_length_m, 1) +
          ' m designed vs ' +
          num(totals.as_built_length_m, 1) +
          ' m recorded as laid';

        var layerRows = layers.map(function (layer) {
          var length = layer.length || {};
          return (
            '<tr>' +
            '<td>' +
            escHtml(layer.layer_name || layer.layer_id) +
            '</td>' +
            '<td class="num">' +
            num(layer.feature_count, 0) +
            '</td>' +
            '<td class="num">' +
            num((layer.status_counts || {}).approved, 0) +
            '</td>' +
            '<td class="num">' +
            num(length.planned_m, 1) +
            '</td>' +
            '<td class="num">' +
            num(length.as_built_m, 1) +
            '</td>' +
            '<td class="num">' +
            deltaHtml(length.delta_m, 'm') +
            '</td>' +
            '<td class="num">' +
            deltaHtml(length.delta_pct, '%') +
            '</td>' +
            '</tr>'
          );
        });

        var fieldRows = [];
        layers.forEach(function (layer) {
          (layer.fields || []).forEach(function (field) {
            if (field.planned_total === null && field.as_built_total === null) return;
            fieldRows.push(
              '<tr>' +
                '<td>' +
                escHtml(layer.layer_name || layer.layer_id) +
                '</td>' +
                '<td>' +
                escHtml(field.key) +
                '</td>' +
                '<td>' +
                escHtml(field.unit || '') +
                '</td>' +
                '<td class="num">' +
                num(field.planned_total) +
                '</td>' +
                '<td class="num">' +
                num(field.as_built_total) +
                '</td>' +
                '<td class="num">' +
                deltaHtml(field.delta, '') +
                '</td>' +
                '<td class="num">' +
                num(field.measured_features, 0) +
                '/' +
                num(field.planned_features, 0) +
                '</td>' +
                '<td class="num">' +
                num(field.outside_features, 0) +
                '</td>' +
                '</tr>'
            );
          });
        });

        asBuiltBody.innerHTML =
          '<h3>Per layer</h3>' +
          reportTable(
            [
              { label: 'Layer' },
              { label: 'Features', num: true },
              { label: 'Approved', num: true },
              { label: 'Planned (m)', num: true },
              { label: 'As-built (m)', num: true },
              { label: 'Δ (m)', num: true },
              { label: 'Δ %', num: true },
            ],
            layerRows
          ) +
          (fieldRows.length
            ? '<h3>Measured fields</h3>' +
              reportTable(
                [
                  { label: 'Layer' },
                  { label: 'Field' },
                  { label: 'Unit' },
                  { label: 'Planned', num: true },
                  { label: 'As-built', num: true },
                  { label: 'Δ', num: true },
                  { label: 'Measured', num: true },
                  { label: 'Outside tolerance', num: true },
                ],
                fieldRows
              )
            : '<p class="report-muted">No numeric attribute has been measured yet, so only lengths can be compared.</p>');

        renderBoq(report.boq || {});
      }

      async function loadAsBuilt(projectId) {
        if (!projectId) {
          asBuiltCard.hidden = true;
          return;
        }
        asBuiltCard.hidden = false;
        asBuiltLead.textContent = '';
        asBuiltBody.innerHTML = '<p class="report-muted">Loading the as-built report…</p>';
        boqBody.innerHTML = '';
        setProjectStatus('');
        try {
          renderAsBuilt(await window.FiberApi.getProjectAsBuiltReport(projectId));
        } catch (err) {
          asBuiltBody.innerHTML = '';
          boqBody.innerHTML = '';
          setProjectStatus(
            'Could not load the as-built report: ' + ((err && err.message) || err),
            'error'
          );
        }
      }

      projectExportBtn.addEventListener('click', async function () {
        var projectId = projectSelect.value;
        if (!projectId) {
          setProjectStatus('Select a project first.', 'error');
          return;
        }
        projectExportBtn.disabled = true;
        setProjectStatus('Building the workbook…');
        try {
          setProjectStatus('Downloaded ' + (await window.FiberApi.downloadProjectExport(projectId)), 'ok');
        } catch (err) {
          setProjectStatus('Export failed: ' + ((err && err.message) || err), 'error');
        } finally {
          projectExportBtn.disabled = false;
        }
      });

      loadProjects();
    </script>

    <script src="partials/sidebar-loader.js"></script>
    <script src="js/ftth-ui.js"></script>
  </body>
</html>
